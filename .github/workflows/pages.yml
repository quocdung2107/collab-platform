name: Deploy web (GitHub Pages)

# Bản web dùng cho thử nghiệm OD-17 (push iPhone) và OD-18 (đăng nhập trong Zalo/Messenger).
# Cần bật Settings → Pages → Source: GitHub Actions. Môi trường github-pages mặc định chỉ cho nhánh main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE: /collab-platform/
      # Các giá trị dưới đây đều công khai theo thiết kế (khoá publishable, khoá VAPID công khai).
      VITE_SUPABASE_URL: https://jgdbeutyiwyrgjirakvn.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_mQdyFM9SBcALt9LDmulCJg_qFX7xVO1
      # URL API trên Render (công khai). Biến repo API_URL (Settings → Secrets and variables → Actions → Variables) ghi đè nếu có.
      VITE_API_URL: ${{ vars.API_URL || 'https://collab-api-jcwa.onrender.com' }}
      VITE_PUSH_SPIKE_URL: https://jgdbeutyiwyrgjirakvn.supabase.co/functions/v1/push-spike
      VITE_VAPID_PUBLIC_KEY: BMViEm2ZCLfBOy_n8gdzjoR2dv_VZc9YOvHsUPl5E9VSH2tmPoOcW2oetdg3JH1Plbqo0KzkzS-0VBF09DVFcOQ
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @collab/web build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
