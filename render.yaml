# Render Blueprint: API Node (apps/api) trên gói miễn phí.
# Tạo bằng: Render Dashboard → New → Blueprint → chọn repo này. Xem docs/SETUP.md mục "Triển khai API lên Render".
services:
  - type: web
    name: collab-api
    runtime: node
    plan: free
    region: singapore # gần Supabase ap-south-1 (Mumbai) nhất trong các vùng của Render
    branch: main
    autoDeploy: true
    buildCommand: npx -y pnpm@10.28.0 install --frozen-lockfile && npx -y pnpm@10.28.0 --filter @collab/api build
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Chuỗi Session pooler từ Supabase (Connect → Session pooler), thêm ?sslmode=require&uselibpqcompat=true. Nhập tay, không commit.
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        value: https://jgdbeutyiwyrgjirakvn.supabase.co
      - key: WEB_ORIGINS
        value: https://quocdung2107.github.io,http://localhost:5173
      - key: REALTIME_DRIVER
        value: supabase
      # Khoá máy chủ Supabase (Project Settings → API Keys: secret / service_role) để bật tệp đính kèm. Nhập tay, không commit.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Web Push (F11b): cặp khoá VAPID (npx web-push generate-vapid-keys) và subject dạng mailto:/https://. Nhập tay, không commit.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
